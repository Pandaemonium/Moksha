<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moksha — Escape the Wheel</title>
  <meta name="description" content="An action roguelite of the Mahabharata. Abhimanyu knew how to break into the Chakravyuha. No one taught him how to leave.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">

  <script src="js/art/sprites.js"></script>
  <script src="js/art/portraits.js"></script>
  <script src="js/art/icons.js"></script>
  <script src="js/art/scenes.js"></script>
  <script src="js/world/regions.js"></script>

    setTimeout(() => { if (!M.game.player) M.boot(); }, 2500);

</html>
